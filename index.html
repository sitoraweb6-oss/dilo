    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var boundFetch = rawFetch ? rawFetch.bind(window) : undefined;
          var activeFetch = boundFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || boundFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment forbids property definition
        }
      })();
    </script>
